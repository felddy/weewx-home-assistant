---
name: build

on:
  merge_group:
    types:
      - checks_requested
  pull_request:
  push:
  repository_dispatch:
    types:
      - apb

permissions: {}

jobs:
  diagnostics:
    name: Run diagnostics
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - id: harden-runner
        name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # tag=v2.22.3
        with:
          egress-policy: audit
      - id: github-status
        name: Check GitHub status
        uses: crazy-max/ghaction-github-status@fa6ac37620bc5d44b93e15caed498629665e9ff5  # tag=v4.2.0
      - id: dump-context
        name: Dump context
        uses: crazy-max/ghaction-dump-context@5355a8e5e6ac5a302e746a1c4b7747a0393863c8  # tag=v2.3.0
  lint:
    name: Lint
    needs:
      - diagnostics
    permissions:
      contents: read
    uses: felddy/reusable-workflows/.github/workflows/common-lint.yml@v5
  python:
    name: Python
    needs:
      - diagnostics
    permissions:
      # The coverage-badge job inherits this grant to publish the badge
      # endpoint to the badges branch; every other job in the called
      # workflow declares contents: read explicitly.
      contents: write
    uses: felddy/reusable-workflows/.github/workflows/python-build.yml@v5
    with:
      python-versions: '["3.11", "3.12", "3.13", "3.14", "3.15"]'
